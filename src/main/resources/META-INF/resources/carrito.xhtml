<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KinalHub - Carrito de Compras</title>
    <link rel="stylesheet" href="styles/carrito.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>

<h:body>
    <header class="header">
        <div class="nav-container flex justify-content-between align-items-center">
            <a href="paginaPrincipal.xhtml" class="logo">📚 KinalHub</a>
            <div class="nav-buttons">
                <a href="catalogo.xhtml" class="btn btn-back">← Seguir Comprando</a>
            </div>
        </div>
    </header>

    <div class="cart-container">
        <h1 class="cart-title">Mi Carrito de Compras</h1>

        <h:form id="cartForm">
            <p:messages id="messages" showDetail="true" closable="true" />

            <h:panelGroup rendered="#{not empty catalogoBean.librosEnCarrito}">
                <div class="cart-content">
                    <p:dataTable id="cartItemsTable" var="libroEnCarrito" value="#{catalogoBean.librosEnCarrito}"
                                 rowKey="#{libroEnCarrito.idLibro}"
                                 styleClass="p-datatable-striped">

                        <p:column headerText="Producto" styleClass="item-product-column">
                            <div class="cart-item">
                                <div class="item-image">
                                    <h:graphicImage value="#{libroEnCarrito.urlPortada}" alt="Portada" style="width: 50px;"/>
                                </div>
                                <div class="item-details">
                                    <div class="item-title">#{libroEnCarrito.titulo}</div>
                                    <div class="item-author">#{libroEnCarrito.autor}</div>
                                </div>
                            </div>
                        </p:column>

                        <p:column headerText="Precio" styleClass="item-price">
                            <h:outputText value="#{libroEnCarrito.precio}">
                                <f:convertNumber type="currency" currencySymbol="Q"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Cantidad" styleClass="item-quantity">
                            <div class="quantity-controls">
                                <p:commandButton icon="pi pi-minus"
                                                 actionListener="#{catalogoBean.disminuirCantidad(libroEnCarrito)}"
                                                 update="@form"
                                                 styleClass="quantity-btn" />
                                <h:outputText value="#{catalogoBean.carrito.items[libroEnCarrito.idLibro]}" styleClass="quantity-display"/>
                                <p:commandButton icon="pi pi-plus"
                                                 actionListener="#{catalogoBean.aumentarCantidad(libroEnCarrito)}"
                                                 update="@form"
                                                 styleClass="quantity-btn" />
                            </div>
                        </p:column>

                        <p:column headerText="Total" styleClass="item-total">
                            <h:outputText value="#{catalogoBean.carrito.items[libroEnCarrito.idLibro] * libroEnCarrito.precio.doubleValue()}">
                                <f:convertNumber type="currency" currencySymbol="Q"/>
                            </h:outputText>
                        </p:column>

                        <p:column styleClass="item-remove">
                            <p:commandButton icon="pi pi-trash"
                                             actionListener="#{catalogoBean.eliminarLibro(libroEnCarrito)}"
                                             update="@form"
                                             styleClass="remove-btn" />
                        </p:column>

                    </p:dataTable>

                    <div class="checkout-section">
                        <h3 class="checkout-title">Resumen del Pedido</h3>

                        <div class="summary-row">
                            <span class="summary-label">Subtotal:</span>
                            <span class="summary-value">
                                <h:outputText value="#{catalogoBean.subtotal}">
                                    <f:convertNumber type="currency" currencySymbol="Q"/>
                                </h:outputText>
                            </span>
                        </div>

                        <div class="summary-row">
                            <span class="summary-label">Envío:</span>
                            <span class="summary-value">
                                <h:outputText value="#{catalogoBean.costoEnvio}">
                                    <f:convertNumber type="currency" currencySymbol="Q"/>
                                </h:outputText>
                            </span>
                        </div>

                        <div class="summary-row">
                            <span class="summary-label">IVA (12%):</span>
                            <span class="summary-value">
                                <h:outputText value="#{catalogoBean.iva}">
                                    <f:convertNumber type="currency" currencySymbol="Q"/>
                                </h:outputText>
                            </span>
                        </div>

                        <div class="summary-row total">
                            <span class="summary-label">Total:</span>
                            <span class="summary-value">
                                <h:outputText value="#{catalogoBean.total}">
                                    <f:convertNumber type="currency" currencySymbol="Q"/>
                                </h:outputText>
                            </span>
                        </div>

                        <p:commandButton value="Proceder al Pago 🛒"
                                         action="#{catalogoBean.irACheckout}"
                                         styleClass="btn btn-checkout mt-3"/>
                    </div>

                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{empty catalogoBean.librosEnCarrito}">
                <div class="empty-cart">
                    <div class="empty-cart-icon">🛒</div>
                    <h3>Tu carrito está vacío</h3>
                    <p>Agrega algunos libros increíbles a tu carrito para comenzar.</p>
                    <a href="catalogo.xhtml" class="btn btn-checkout" style="display: inline-block; margin-top: 1rem;">
                        Explorar Catálogo
                    </a>
                </div>
            </h:panelGroup>

        </h:form>
    </div>
</h:body>
</html>
