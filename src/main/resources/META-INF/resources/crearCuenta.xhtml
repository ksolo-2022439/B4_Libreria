<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KinalHub - Registrarse</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
    <link rel="stylesheet" href="styles/crearCuenta.css"/>
</h:head>

<h:body>
    <div class="floating-books">
        <div class="floating-book">📚</div>
        <div class="floating-book">📖</div>
        <div class="floating-book">📘</div>
    </div>

    <div class="back-home">
        <a href="paginaPrincipal.xhtml"><span>←</span> Volver al inicio</a>
    </div>

    <div class="register-container flex align-items-center justify-content-center p-4">
        <div class="register-card">
            <div class="logo-section">
                <a href="paginaPrincipal.xhtml" class="logo">📚 KinalHub</a>
            </div>

            <h1 class="register-title">Crear Cuenta</h1>
            <p class="register-subtitle">Únete a nuestra comunidad de lectores</p>

            <h:messages styleClass="messages" errorClass="alert alert-danger"/>

            <h:form>
                <div class="form-group">
                    <label class="form-label">Nombre de Usuario</label>
                    <h:inputText value="#{usuarioBean.usuario.nombreUsuario}" styleClass="form-input" required="true" requiredMessage="El nombre de usuario es obligatorio."/>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <h:inputText value="#{usuarioBean.usuario.correoElectronico}" styleClass="form-input" required="true" requiredMessage="El email es obligatorio."/>
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <h:inputSecret value="#{usuarioBean.usuario.contrasena}" styleClass="form-input" required="true" requiredMessage="La contraseña es obligatoria."/>
                    <div class="password-requirements">
                        • Mínimo 8 caracteres
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    <h:inputSecret value="#{usuarioBean.confirmarContrasena}" styleClass="form-input" required="true" requiredMessage="Debes confirmar tu contraseña."/>
                </div>

                <h:commandButton action="#{usuarioBean.registrar}" value="Crear Mi Cuenta" styleClass="btn btn-primary"/>
            </h:form>

            <div class="divider"><span>o</span></div>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="iniciarSesion.xhtml">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</h:body>
</html>
