<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KinalHub - Registrarse</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
    <link rel="stylesheet" href="styles/crearCuenta.css"/>
</head>

<body>
<div class="floating-books">
    <div class="floating-book">📚</div>
    <div class="floating-book">📖</div>
    <div class="floating-book">📘</div>
    <div class="floating-book">📕</div>
    <div class="floating-book">📗</div>
    <div class="floating-book">📙</div>
</div>

<div class="back-home">
    <a href="paginaPrincipal.xhtml">
        <span>←</span>
        Volver al inicio
    </a>
</div>

<div class="register-container flex align-items-center justify-content-center p-4">
    <div class="register-card">
        <div class="logo-section">
            <a href="paginaPrincipal.xhtml" class="logo">📚 KinalHub</a>
        </div>

        <h1 class="register-title">Crear Cuenta</h1>
        <p class="register-subtitle">Únete a nuestra comunidad de lectores</p>

        <form>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" placeholder="Tu nombre" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-input" placeholder="Tu apellido" required/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" placeholder="tu@email.com" required/>
            </div>

            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-input" placeholder="+502 0000-0000"/>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-input" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Género</label>
                    <select class="form-select" required>
                        <option value="">Seleccionar</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                        <option value="prefiero-no-decir">Prefiero no decir</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-input" placeholder="••••••••" required minlength="8"/>
                <div class="password-requirements">
                    • Mínimo 8 caracteres<br>
                    • Se recomienda incluir números y símbolos
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" class="form-input" placeholder="••••••••" required minlength="8"/>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required/>
                <label for="terms">
                    Acepto los <a href="#">términos y condiciones</a> y la
                    <a href="#">política de privacidad</a> de KinalHub
                </label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="newsletter"/>
                <label for="newsletter">
                    Quiero recibir ofertas especiales y recomendaciones de libros por email
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Crear Mi Cuenta
            </button>
        </form>

        <div class="divider">
            <span>o</span>
        </div>

        <div class="flex justify-content-center">
            <a href="iniciarSesion.xhtml" class="btn btn-secondary">
                Ya Tengo Cuenta
            </a>
        </div>

        <div class="login-link">
            ¿Ya tienes cuenta? <a href="iniciarSesion.xhtml">Inicia sesión aquí</a>
        </div>
    </div>
</div>
</body>

</html>
