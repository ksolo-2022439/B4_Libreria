<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KinalHub - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles/iniciarSesion.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>

<h:body>
    <div class="floating-books">
        <div class="floating-book">📚</div>
        <div class="floating-book">📖</div>
        <div class="floating-book">📘</div>
        <div class="floating-book">📕</div>
    </div>

    <div class="back-home">
        <a href="paginaPrincipal.xhtml"><span>←</span> Volver al inicio</a>
    </div>

    <div class="login-container flex align-items-center justify-content-center p-4">
        <div class="login-card">
            <div class="logo-section">
                <a href="paginaPrincipal.xhtml" class="logo">📚 KinalHub</a>
            </div>

            <h1 class="login-title">Iniciar Sesión</h1>
            <p class="login-subtitle">Accede a tu cuenta para continuar</p>

            <h:messages globalOnly="true" styleClass="messages" errorClass="alert alert-danger"/>

            <h:form>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <h:inputText value="#{loginBean.correoElectronico}" styleClass="form-input" required="true" requiredMessage="El email es obligatorio."/>
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <h:inputSecret value="#{loginBean.contrasena}" styleClass="form-input" required="true" requiredMessage="La contraseña es obligatoria."/>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="checkbox-group">
                        <h:selectBooleanCheckbox id="rememberMe" value="#{loginBean.rememberMe}" />
                        <label for="rememberMe" class="form-label ml-2">Recuérdame</label>
                    </div>
                </div>

                <h:commandButton action="#{loginBean.iniciarSesion}" value="Iniciar Sesión" styleClass="btn btn-primary mt-3"/>
            </h:form>

            <div class="divider">
                <span>o</span>
            </div>

            <div class="register-link">
                ¿No tienes cuenta? <a href="crearCuenta.xhtml">Regístrate aquí</a>
            </div>
        </div>
    </div>
</h:body>
</html>
