<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catálogo de Libros - KinalHub</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
    <link rel="stylesheet" href="styles/catalogo.css"/>
    <link rel="stylesheet" href="styles/paginaPrincipal.css"/>
</h:head>

<h:body>
    <div class="floating-books">
        <div class="floating-book">📚</div>
        <div class="floating-book">📖</div>
    </div>
    
    <header class="header">
        <div class="nav-container flex justify-content-between align-items-center">
            <a href="paginaPrincipal.xhtml" class="logo" style="text-decoration: none; color: white;">📚 KinalHub</a>

            <h:form>
                <h:panelGroup rendered="#{not sessionBean.isLoggedIn()}">
                    <div class="nav-buttons flex flex-column md:flex-row gap-3">
                        <a href="iniciarSesion.xhtml" class="btn btn-login">Iniciar Sesión</a>
                        <a href="crearCuenta.xhtml" class="btn btn-register">Registrarse</a>
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{sessionBean.isLoggedIn()}">
                    <div class="nav-buttons flex align-items-center gap-3">
                        <span class="welcome-message">¡Hola, #{sessionBean.usuarioLogueado.nombreUsuario}!</span>
                        <h:commandButton action="#{sessionBean.logout}" value="Cerrar Sesión" styleClass="btn btn-logout"/>
                    </div>
                </h:panelGroup>
            </h:form>
        </div>
    </header>

    <section class="catalogo-section">
        <div class="container mx-auto px-4 lg:px-6">
            <h1 class="section-title text-center text-5xl mb-8">Catálogo de Libros</h1>

            <h:panelGroup rendered="#{not empty libroController.libros}">
                <div class="grid grid-nogutter">
                    <ui:repeat value="#{libroController.libros}" var="libro" varStatus="loop">
                        <div class="col-12 sm:col-6 md:col-4 lg:col-3 p-3">
                            <div class="book-card">
                                <h:graphicImage value="#{libro.urlPortada}" alt="Portada de #{libro.titulo}" styleClass="book-cover"/>
                                <div class="book-info">
                                    <div class="book-title">#{libro.titulo}</div>
                                    <div class="book-author">#{libro.autor}</div>
                                    <div class="book-price">
                                        <h:outputText value="#{libro.precio}">
                                            <f:convertNumber type="currency" currencySymbol="Q"/>
                                        </h:outputText>
                                    </div>
                                    <h:form>
                                        <h:commandButton value="Añadir al Carrito" 
                                            actionListener="#{catalogoBean.agregarAlCarrito(libro)}"
                                            styleClass="p-button-success mt-3 add-to-cart-btn" />
                                    </h:form>
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{empty libroController.libros}">
                <div class="no-books-message">
                    <p class="text-xl">¡Vaya! Parece que no hay libros disponibles en este momento.</p>
                </div>
            </h:panelGroup>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-bottom text-center">
            <p>&#169; 2025 KinalHub. Todos los derechos reservados.</p>
        </div>
    </footer>
</h:body>
</html>
