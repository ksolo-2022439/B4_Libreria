<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="es">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KinalHub - Información de Pago</title>
    <link rel="stylesheet" href="styles/checkout.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>

<h:body>
    <div class="checkout-container p-grid p-justify-center">
        <div class="p-col-12 p-md-8 p-lg-6">
            <h1 class="checkout-title">Información de Envío</h1>
            <h:form id="checkoutForm">
                <p:messages id="messages" showDetail="true" closable="true" />

                <p:panelGrid columns="2" layout="grid" styleClass="p-nogutter p-shadow-10 p-mb-3 form-panel">
                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="nombre" value="Nombre:"/>
                        <p:inputText id="nombre" value="#{catalogoBean.nombre}" required="true" requiredMessage="El nombre es obligatorio." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="apellido" value="Apellido:"/>
                        <p:inputText id="apellido" value="#{catalogoBean.apellido}" required="true" requiredMessage="El apellido es obligatorio." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12">
                        <p:outputLabel for="email" value="Correo Electrónico:"/>
                        <p:inputText id="email" value="#{catalogoBean.email}" required="true" requiredMessage="El correo electrónico es obligatorio." validatorMessage="Formato de correo inválido." styleClass="p-inputtext p-component p-d-block">
                            <f:validateRegex pattern="[\w\.-]*[a-zA-Z0-9_]@[\w\.-]*[a-zA-Z0-9]\.[a-zA-Z][a-zA-Z\.]*[a-zA-Z]"/>
                        </p:inputText>
                    </div>

                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="telefono" value="Teléfono:"/>
                        <p:inputText id="telefono" value="#{catalogoBean.telefono}" required="true" requiredMessage="El teléfono es obligatorio." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="direccion" value="Dirección:"/>
                        <p:inputText id="direccion" value="#{catalogoBean.direccion}" required="true" requiredMessage="La dirección es obligatoria." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="ciudad" value="Ciudad:"/>
                        <p:inputText id="ciudad" value="#{catalogoBean.ciudad}" required="true" requiredMessage="La ciudad es obligatoria." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="departamento" value="Departamento:"/>
                        <p:inputText id="departamento" value="#{catalogoBean.departamento}" required="true" requiredMessage="El departamento es obligatorio." styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                    <div class="p-field p-col-12">
                        <p:outputLabel for="instrucciones" value="Instrucciones de entrega:"/>
                        <p:inputTextarea id="instrucciones" value="#{catalogoBean.instrucciones}" rows="3" styleClass="p-inputtext p-component p-d-block"/>
                    </div>

                </p:panelGrid>

                <p:commandButton value="Confirmar y Pagar"
                                 action="#{catalogoBean.procesarCompra}"
                                 update="@form"
                                 styleClass="btn btn-confirm p-d-block p-mt-3"/>

                <h:link value="← Volver al Carrito" outcome="carrito" styleClass="btn btn-back p-d-block p-mt-3"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
